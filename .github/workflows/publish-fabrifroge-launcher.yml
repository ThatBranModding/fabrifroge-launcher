name: Native launcher builds
on:
  workflow_dispatch:
  push:
    tags: ['launcher-v*']
permissions:
  contents: read
jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-13
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish FabriFrogeLauncher/FabriFrogeLauncher/FabriFrogeLauncher.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Ensure Linux launcher is executable
        if: startsWith(matrix.rid, 'linux-')
        run: chmod +x publish/FabriFrogeLauncher && tar -czf FabriFrogeLauncher-${{ matrix.rid }}.tar.gz -C publish .
      - name: Package Windows and macOS builds
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath FabriFrogeLauncher-${{ matrix.rid }}.zip
      - name: Package macOS app bundle
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          mkdir -p FabriFrogeLauncher.app/Contents/MacOS
          cp -R publish/. FabriFrogeLauncher.app/Contents/MacOS/
          cat > FabriFrogeLauncher.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>FabriFrogeLauncher</string><key>CFBundleIdentifier</key><string>com.fabrifroge.launcher</string><key>CFBundleName</key><string>FabriFroge Launcher</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleVersion</key><string>1.1.3</string><key>LSMinimumSystemVersion</key><string>12.0</string></dict></plist>
          PLIST
          chmod +x FabriFrogeLauncher.app/Contents/MacOS/FabriFrogeLauncher
          tar -czf FabriFrogeLauncher-${{ matrix.rid }}.tar.gz FabriFrogeLauncher.app
      - uses: actions/upload-artifact@v4
        with:
          name: FabriFrogeLauncher-${{ matrix.rid }}
          path: |
            FabriFrogeLauncher-${{ matrix.rid }}.zip
            FabriFrogeLauncher-${{ matrix.rid }}.tar.gz
