name: Repair launcher 1.1.7 uploads

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-launcher-1-1-7-uploads.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 43297043981
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true
      - name: Create version 1.1.7 metadata and checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("artifacts")
          version = "1.1.7"
          downloads = {}
          installers = {}
          for rid in ("win-x64", "win-arm64", "osx-x64", "osx-arm64", "linux-x64", "linux-arm64"):
              archive_suffix = ".zip" if rid.startswith("win-") else ".tar.gz"
              archive = root / f"FabriFrogeLauncher-{version}-{rid}{archive_suffix}"
              if not archive.is_file() or archive.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty update archive: {archive}")
              downloads[rid] = {
                  "url": f"https://files.fabrifroge.com/launcher/v2/self/builds/{archive.name}",
                  "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              }
              ext = ".exe" if rid.startswith("win-") else ".dmg" if rid.startswith("osx-") else ".deb"
              name = f"FabriFrogeLauncher-{version}-{rid}-setup{ext}" if rid.startswith("win-") else f"FabriFrogeLauncher-{version}-{rid}{ext}"
              installer = root / name
              if not installer.is_file() or installer.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty installer: {installer}")
              installers[rid] = {
                  "url": f"https://files.fabrifroge.com/launcher/v2/self/installers/{installer.name}",
                  "sha256": hashlib.sha256(installer.read_bytes()).hexdigest(),
              }
          (root / "launcher-self-latest.json").write_text(json.dumps({"version": version, "downloads": downloads, "installers": installers}, indent=2) + "\n")
          with (root / "SHA256SUMS.txt").open("w") as sums:
              for path in sorted(root.glob("FabriFrogeLauncher-*")) + [root / "launcher-self-latest.json"]:
                  sums.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          expected = []
          for group in (downloads, installers):
              for item in group.values():
                  local_name = item["url"].rsplit("/", 1)[-1]
                  local_file = root / local_name
                  expected.append({"url": item["url"], "size": local_file.stat().st_size})
          pathlib.Path("verify-uploads.json").write_text(json.dumps(expected))
          PY
      - name: Upload installer and update files, then verify server sizes
        env:
          SSHPASS: ${{ secrets.FABRIFROGE_SFTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SSHPASS:-}" ]]; then
            echo "Missing repository secret FABRIFROGE_SFTP_PASSWORD" >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -t ed25519 ftp.fabrifroge.com > "$HOME/.ssh/known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}' | sed 's/^SHA256://' | sed 's/=*$//')"
          expected_fingerprint='jygYqLouvUiCQUTXy1r0EWmRXpoWSO/OHCPVwOBPiZg'
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "SFTP host key does not match the pinned fingerprint" >&2
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          batch_file="$(mktemp)"
          log_file="$RUNNER_TEMP/sftp-upload.log"
          trap 'rm -f "$batch_file"' EXIT
          printf '%s\n' 'cd "/C:/Users/Branserver/Downloads/nginx-1.26.3/www/files"' > "$batch_file"
          for package in artifacts/FabriFrogeLauncher-*; do
            [[ -f "$package" ]] || continue
            case "$package" in
              *-setup.exe|*.dmg|*.deb) destination='launcher/v2/self/installers/' ;;
              *) destination='launcher/v2/self/builds/' ;;
            esac
            printf 'put "%s" "%s"\n' "$package" "$destination" >> "$batch_file"
          done
          printf '%s\n' \
            'put "artifacts/SHA256SUMS.txt" "launcher/v2/self/SHA256SUMS.txt"' \
            'put "artifacts/launcher-self-latest.json" "launcher/v2/self/latest.json"' \
            'put "artifacts/launcher-self-latest.json" "/C:/Users/Branserver/Downloads/nginx-1.26.3/www/download/latest.json"' >> "$batch_file"
          python - <<'PY' >> "$batch_file"
          import json
          for item in json.load(open("verify-uploads.json", encoding="utf-8")):
              relative = item["url"].split("/launcher/v2/self/", 1)[1]
              print(f'ls -l "launcher/v2/self/{relative}"')
          PY
          set +e
          sshpass -e sftp -P 22 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            launcher@ftp.fabrifroge.com < "$batch_file" 2>&1 | tee "$log_file"
          sftp_status=${PIPESTATUS[0]}
          set -e
          if [[ "$sftp_status" -ne 0 ]] || grep -Eiq 'Failure|No such file|Permission denied|Connection closed|Couldn.t' "$log_file"; then
            echo "SFTP reported a failed upload; refusing to mark launcher 1.1.7 as repaired." >&2
            exit 1
          fi
          python - "$log_file" <<'PY'
          import json, pathlib, sys
          expected = json.load(open("verify-uploads.json", encoding="utf-8"))
          by_name = {item["url"].rsplit("/", 1)[-1]: item["size"] for item in expected}
          actual = {}
          for line in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines():
              fields = line.strip().split()
              if len(fields) < 9 or not fields[0].startswith(("-", "d", "l")):
                  continue
              try:
                  size = int(fields[4])
              except ValueError:
                  continue
              name = pathlib.PurePosixPath(" ".join(fields[8:])).name
              if name in by_name:
                  actual[name] = size
          for name, expected_size in by_name.items():
              actual_size = actual.get(name)
              if actual_size != expected_size:
                  raise SystemExit(f"Remote size mismatch for {name}: {actual_size} bytes; expected {expected_size}.")
              print(f"Verified {name}: {actual_size} bytes")
          PY
