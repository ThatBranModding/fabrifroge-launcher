name: Build launcher installers

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content FabriFrogeLauncher/FabriFrogeLauncher/FabriFrogeLauncher.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME.StartsWith('launcher-v') -and $env:GITHUB_REF_NAME.Substring(10) -ne $version) { throw "Tag version must match project version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish self-contained launcher
        run: dotnet publish FabriFrogeLauncher/FabriFrogeLauncher/FabriFrogeLauncher.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/publish/${{ matrix.rid }}
      - name: Build ZIP or native macOS/Linux installer
        run: python FabriFrogeLauncher/FabriFrogeLauncher/package-platform.py --rid ${{ matrix.rid }} --version ${{ steps.version.outputs.version }} --source artifacts/publish/${{ matrix.rid }} --output artifacts/release
      - name: Build Windows setup installer
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$((Resolve-Path artifacts/publish/${{ matrix.rid }}).Path)" "/O$((Resolve-Path artifacts/release).Path)" FabriFrogeLauncher/release/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Move-Item artifacts/release/FabriFrogeLauncher-Setup-${{ steps.version.outputs.version }}.exe artifacts/release/FabriFrogeLauncher-${{ steps.version.outputs.version }}-${{ matrix.rid }}-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release metadata and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#launcher-v}"
          python - "$version" <<'PY'
          import hashlib, json, pathlib, sys
          (version,) = sys.argv[1:]
          root = pathlib.Path("artifacts")
          downloads = {}
          installers = {}
          for rid in ("win-x64", "win-arm64", "osx-x64", "osx-arm64", "linux-x64", "linux-arm64"):
              suffix = ".zip" if rid.startswith("win-") else ".tar.gz"
              archive = root / f"FabriFrogeLauncher-{version}-{rid}{suffix}"
              if not archive.exists():
                  raise SystemExit(f"Missing update archive: {archive}")
              url = f"https://files.fabrifroge.com/launcher/self/builds/{archive.name}"
              downloads[rid] = {"url": url, "sha256": hashlib.sha256(archive.read_bytes()).hexdigest()}
              installer_ext = ".exe" if rid.startswith("win-") else ".dmg" if rid.startswith("osx-") else ".deb" if rid.startswith("linux-") else None
              if installer_ext:
                  pattern = f"FabriFrogeLauncher-{version}-{rid}-setup{installer_ext}" if rid.startswith("win-") else f"FabriFrogeLauncher-{version}-{rid}{installer_ext}"
                  installer = root / pattern
                  if not installer.exists():
                      raise SystemExit(f"Missing installer: {installer}")
                  installers[rid] = {"url": f"https://files.fabrifroge.com/launcher/self/installers/{installer.name}", "sha256": hashlib.sha256(installer.read_bytes()).hexdigest()}
          (root / "launcher-self-latest.json").write_text(json.dumps({"version": version, "downloads": downloads, "installers": installers}, indent=2) + "\n")
          PY
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
      - name: Upload launcher files to homeserver
        env:
          SSHPASS: ${{ secrets.FABRIFROGE_SFTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SSHPASS:-}" ]]; then
            echo "Missing repository secret FABRIFROGE_SFTP_PASSWORD" >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -t ed25519 ftp.fabrifroge.com > "$HOME/.ssh/host-key-scan" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/host-key-scan" -E sha256 | awk '{print $2}' | sed 's/^SHA256://' | sed 's/=*$//')"
          expected_fingerprint='jygYqLouvUiCQUTXy1r0EWmRXpoWSO/OHCPVwOBPiZg'
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "SFTP host key does not match the pinned fingerprint" >&2
            exit 1
          fi
          cp "$HOME/.ssh/host-key-scan" "$HOME/.ssh/known_hosts"
          rm "$HOME/.ssh/host-key-scan"
          chmod 600 "$HOME/.ssh/known_hosts"
          batch_file="$(mktemp)"
          trap 'rm -f "$batch_file"' EXIT
          printf '%s\n' \
            'cd "/C:/Users/Branserver/Downloads/nginx-1.26.3/www/files"' \
            '-mkdir launcher' \
            '-mkdir launcher/self' \
            '-mkdir launcher/self/builds' \
            '-mkdir launcher/self/installers' > "$batch_file"
          for package in artifacts/FabriFrogeLauncher-*; do
            [[ -f "$package" ]] || continue
            case "$package" in
              *-setup.exe|*.dmg|*.deb) destination='launcher/self/installers/' ;;
              *) destination='launcher/self/builds/' ;;
            esac
            printf 'put "%s" "%s"\n' "$package" "$destination" >> "$batch_file"
          done
          printf '%s\n' \
            'put artifacts/SHA256SUMS.txt launcher/self/SHA256SUMS.txt' \
            'put artifacts/launcher-self-latest.json launcher/self/latest.json' >> "$batch_file"
sshpass -e sftp -P 22 \
  -o PreferredAuthentications=keyboard-interactive,password \
  -o PubkeyAuthentication=no \
  -o StrictHostKeyChecking=yes \
  -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
  -b "$batch_file" \
  launcher@ftp.fabrifroge.com
